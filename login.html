<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Login - Aplikasi Rekap Stok</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box" style="max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center;">
        <h2 style="margin-bottom: 16px; color: #2c3e50;">Silakan Login</h2>
        <div id="error" class="error-msg" style="color: #d32f2f; font-size: 13px; margin-bottom: 10px; display: none;">Username atau Password salah!</div>

        <form id="form-login">
            <div class="form-group" style="text-align: left; margin-bottom: 12px;">
                <label style="display: block; font-size: 14px; margin-bottom: 4px; font-weight: 500;">Username</label>
                <input type="text" id="user" required autocomplete="off" style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; outline: none;">
            </div>
            <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                <label style="display: block; font-size: 14px; margin-bottom: 4px; font-weight: 500;">Password</label>
                <input type="password" id="pass" required style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; outline: none;">
            </div>
            <button type="submit" class="btn" style="width: 100%; background: #6200EE; color: white; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;">LOGIN</button>
        </form>
    </div>

    <!-- 1. PANGGIL LOGIN.JS TERLEBIH DAHULU -->
    <script src="login.js"></script>

    <!-- 2. KODE LOGIKA LOGIN -->
    <script>
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();

            let uInput = document.getElementById('user').value.trim();
            let pInput = document.getElementById('pass').value.trim();

            // Pastikan variabel daftarUser terbaca dari login.js
            if (typeof daftarUser === 'undefined') {
                alert("File login.js tidak terbaca! Pastikan file login.js berada di folder yang sama.");
                return;
            }

            // Mencari user yang cocok
            let ditemukan = daftarUser.find(acc => acc.username === uInput && acc.password === pInput);

            if (ditemukan) {
                // Simpan sesi login
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', ditemukan.username);

                // Pindah halaman utama
                window.location.assign('index.html');
            } else {
                // Munculkan pesan error
                document.getElementById('error').style.display = 'block';
            }
        });
    </script>
</body>
</html>
